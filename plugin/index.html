<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    /* O painel ocupa a altura toda; só a lista (#content) rola. */
    html, body { height: 100%; }
    body { font-family: sans-serif; font-size: 12px; color: #e8e8ea; background: #141416; margin: 0; padding: 10px;
           display: flex; flex-direction: column; overflow: hidden; }
    .header, #settings, #status { flex-shrink: 0; }
    #main { flex-grow: 1; min-height: 0; display: flex; flex-direction: column; }
    #nav, #title, #search, #filters { flex-shrink: 0; }
    #content { flex-grow: 1; min-height: 0; overflow-y: scroll; padding-right: 4px; }
    #content::-webkit-scrollbar { width: 6px; }
    #content::-webkit-scrollbar-thumb { background: #3a3a42; border-radius: 3px; }

    /* cabeçalho */
    .header { display: flex; flex-direction: row; align-items: center; margin-bottom: 10px; }
    .logo { width: 22px; height: 22px; border-radius: 6px; background: #7c5cff; color: #fff; text-align: center; line-height: 22px; font-size: 12px; margin-right: 8px; }
    .appname { font-size: 14px; font-weight: bold; flex-grow: 1; }
    .iconbtn { width: 26px; height: 26px; border-radius: 13px; background: #222226; color: #bbb; text-align: center; line-height: 26px; font-size: 13px; cursor: pointer; }
    .iconbtn:hover, .iconbtn.on { background: #7c5cff; color: #fff; }

    /* configurações */
    #settings { background: #1c1c20; border-radius: 12px; padding: 10px; margin-bottom: 10px; }
    #settings.hidden { display: none; }
    .row { display: flex; flex-direction: row; align-items: center; margin-bottom: 8px; }
    .row > * { margin-right: 6px; }
    .pill { padding: 5px 12px; border-radius: 14px; background: #2a2a30; color: #ddd; cursor: pointer; font-size: 11px; }
    .pill:hover { background: #34343c; }
    .pill.primary { background: #7c5cff; color: #fff; }
    #libPath { color: #777; font-size: 10px; word-break: break-all; margin-bottom: 8px; }
    label { color: #999; font-size: 11px; }
    select { background: #111; color: #fff; border: 1px solid #333; border-radius: 6px; }

    /* painel principal */
    #main { background: #1c1c20; border-radius: 16px; padding: 12px; }
    .nav { display: flex; flex-direction: row; align-items: center; margin-bottom: 6px; }
    .back { width: 26px; height: 26px; border-radius: 8px; background: #2a2a30; color: #ddd; text-align: center; line-height: 26px; font-size: 14px; cursor: pointer; }
    .back:hover { background: #7c5cff; color: #fff; }
    .crumb { flex-grow: 1; text-align: center; color: #888; font-size: 11px; margin-right: 26px; }
    .title { display: flex; flex-direction: row; align-items: flex-end; margin: 4px 0 10px; }
    .title .big { font-size: 22px; font-weight: bold; color: #fff; margin-right: 8px; }
    .title .count { color: #888; font-size: 11px; padding-bottom: 4px; }

    #search { width: 100%; padding: 8px 12px; background: #111114; color: #fff; border: 1px solid #2c2c33; border-radius: 10px; font-size: 12px; }

    .filters { display: flex; flex-direction: row; justify-content: flex-end; margin: 8px 0 6px; }
    .filter { color: #777; font-size: 11px; margin-left: 12px; cursor: pointer; }
    .filter.on { color: #fff; font-weight: bold; }

    /* cards de categoria */
    .cards { display: flex; flex-direction: row; flex-wrap: wrap; justify-content: space-between; margin-top: 10px; }
    .card { width: 48%; background: #24242a; border-radius: 12px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
    .card:hover { background: #2d2d35; }
    .card .cname { font-weight: bold; color: #fff; font-size: 12px; }
    .card .ccount { color: #888; font-size: 10px; margin-top: 2px; }
    .card.fav { background: #2b2540; }

    /* lista de sons */
    .item { display: flex; flex-direction: row; align-items: center; background: #24242a; border-radius: 12px; padding: 8px; margin-top: 6px; cursor: pointer; }
    .item:hover { background: #2b2b32; }
    .item.busy { opacity: 0.5; }
    .play { width: 30px; height: 30px; border-radius: 9px; background: #121215; color: #ddd; text-align: center; line-height: 30px; font-size: 10px; margin-right: 10px; flex-shrink: 0; }
    .play.playing { background: #7c5cff; color: #fff; }
    .info { flex-grow: 1; }
    .info .name { font-weight: bold; color: #fff; font-size: 12px; }
    .info .meta { color: #888; font-size: 10px; margin-top: 2px; }
    .add { width: 28px; height: 28px; border-radius: 9px; background: #34343c; color: #fff; text-align: center; line-height: 28px; font-size: 16px; flex-shrink: 0; }
    .add:hover { background: #7c5cff; }
    .empty { color: #888; padding: 18px 4px; text-align: center; }

    #status { color: #888; font-size: 11px; margin-top: 8px; min-height: 14px; }
    #status.ok { color: #8fd18f; } #status.err { color: #ee7a7a; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">♪</div>
    <div class="appname">Sound Library</div>
    <div class="iconbtn" id="btnSettings" title="Configurações">⚙</div>
  </div>

  <div id="settings" class="hidden">
    <div class="row">
      <div class="pill primary" id="btnFolder">Escolher pasta</div>
      <div class="pill" id="btnRefresh">Atualizar</div>
    </div>
    <div id="libPath">Nenhuma pasta escolhida.</div>
    <div class="row">
      <label>Faixa:</label>
      <select id="track"></select>
      <label>Modo:</label>
      <select id="mode">
        <option value="overwrite">Sobrescrever</option>
        <option value="insert">Empurrar clipes</option>
      </select>
    </div>
  </div>

  <div id="main">
    <div id="nav"></div>
    <div id="title"></div>
    <input id="search" type="text" placeholder="Buscar sons…" />
    <div id="filters"></div>
    <div id="content"></div>
  </div>
  <div id="status"></div>

  <script src="main.js"></script>
</body>
</html>
