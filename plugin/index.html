<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: sans-serif; font-size: 12px; color: #ddd; background: #232323; padding: 10px; }
    h2 { font-size: 14px; margin: 0 0 10px; }
    .row { margin-bottom: 10px; }
    label { display: block; margin-bottom: 4px; color: #aaa; }
    #file { word-break: break-all; color: #fff; }
    #log { white-space: pre-wrap; background: #111; padding: 8px; border-radius: 4px; min-height: 120px; font-family: monospace; font-size: 11px; }
    .ok { color: #7c7; } .err { color: #e77; }
  </style>
</head>
<body>
  <h2>Sound Library · Teste (Fase 0)</h2>

  <div class="row">
    <sp-button id="btnPick">1. Escolher arquivo de áudio</sp-button>
    <div id="file">(nenhum arquivo)</div>
  </div>

  <div class="row">
    <label>Índice da faixa de áudio (teste 0, 1, 2…)</label>
    <sp-textfield id="audioTrack" value="2"></sp-textfield>
  </div>

  <div class="row">
    <label>Índice da faixa de vídeo (usado pela API; teste 0)</label>
    <sp-textfield id="videoTrack" value="0"></sp-textfield>
  </div>

  <div class="row">
    <sp-button id="btnOverwrite">2a. Inserir no playhead (sobrescrever)</sp-button>
  </div>
  <div class="row">
    <sp-button id="btnInsert" variant="secondary">2b. Inserir no playhead (empurrar clipes)</sp-button>
  </div>

  <label>Log (copie e me mande se der erro):</label>
  <div id="log"></div>

  <script src="main.js"></script>
</body>
</html>
