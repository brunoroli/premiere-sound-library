<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: sans-serif; font-size: 12px; color: #ddd; background: #232323; margin: 0; padding: 8px; }
    .bar { display: flex; flex-direction: row; align-items: center; margin-bottom: 8px; }
    .bar > * { margin-right: 6px; }
    .grow { flex-grow: 1; }
    #libPath { color: #888; font-size: 10px; margin-bottom: 6px; word-break: break-all; }
    #search { width: 100%; padding: 4px 6px; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px; }
    #tabs { display: flex; flex-direction: row; flex-wrap: wrap; margin-bottom: 6px; }
    .tab { padding: 3px 8px; margin: 0 4px 4px 0; border-radius: 10px; background: #333; color: #ccc; cursor: pointer; font-size: 11px; }
    .tab.active { background: #2680eb; color: #fff; }
    #list { border-top: 1px solid #333; }
    .item { display: flex; flex-direction: row; align-items: center; padding: 6px 4px; border-bottom: 1px solid #2c2c2c; cursor: pointer; }
    .item:hover { background: #2f2f2f; }
    .item .name { flex-grow: 1; color: #eee; }
    .item .cat { color: #777; font-size: 10px; margin-left: 6px; }
    .item.busy { opacity: 0.5; }
    .empty { color: #888; padding: 16px 4px; text-align: center; }
    #status { color: #888; font-size: 11px; margin-top: 6px; min-height: 14px; }
    #status.ok { color: #7c7; } #status.err { color: #e77; }
    select { background: #111; color: #fff; border: 1px solid #444; }
    label { color: #aaa; font-size: 11px; }
  </style>
</head>
<body>
  <div class="bar">
    <sp-button id="btnFolder" size="s">Escolher pasta</sp-button>
    <sp-button id="btnRefresh" size="s" variant="secondary">Atualizar</sp-button>
  </div>
  <div id="libPath">Nenhuma pasta escolhida.</div>

  <div class="bar">
    <label>Faixa:</label>
    <select id="track"></select>
    <label>Modo:</label>
    <select id="mode">
      <option value="overwrite">Sobrescrever</option>
      <option value="insert">Empurrar clipes</option>
    </select>
  </div>

  <input id="search" type="text" placeholder="Buscar som…" />
  <div style="height:6px"></div>
  <div id="tabs"></div>
  <div id="list"><div class="empty">Escolha a pasta da sua biblioteca (ex.: "Sounds fx" no Google Drive).</div></div>
  <div id="status"></div>

  <script src="main.js"></script>
</body>
</html>
